<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dbviewer · DBML + Mermaid</title>
    <meta name="description" content="Visor y editor de diagramas DBML y Mermaid con cajas arrastrables." />
    <script>
      // Fija el tema antes del primer pintado: si esperamos a React se ve un
      // destello del tema equivocado.
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('dbviewer') || 'null');
          var theme = saved && saved.state && saved.state.theme;
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.dataset.theme = theme;
        } catch (_) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
