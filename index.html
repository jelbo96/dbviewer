<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>dbviewer · editor de diagramas DBML y Mermaid</title>
    <meta
      name="description"
      content="Edita esquemas DBML y diagramas Mermaid y acomoda las cajas arrastrándolas. Exporta a PNG, SVG y SQL. Funciona en el navegador, sin cuenta."
    />
    <link rel="canonical" href="https://dbviewer.pages.dev/" />
    <meta name="author" content="Ignacio Jelvez" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#6366f1" />

    <!-- Open Graph / Twitter: lo que se ve al pegar el enlace en Slack, WhatsApp
         o X. Las URLs deben ser absolutas; si cambias de dominio, actualiza
         también robots.txt y sitemap.xml. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="dbviewer" />
    <meta property="og:title" content="dbviewer · editor de diagramas DBML y Mermaid" />
    <meta
      property="og:description"
      content="Edita esquemas DBML y diagramas Mermaid y acomoda las cajas arrastrándolas. Exporta a PNG, SVG y SQL."
    />
    <meta property="og:url" content="https://dbviewer.pages.dev/" />
    <meta property="og:image" content="https://dbviewer.pages.dev/favicon.svg" />
    <meta property="og:locale" content="es_CL" />
    <meta name="twitter:card" content="summary" />
    <script>
      // Fija el tema antes del primer pintado: si esperamos a React se ve un
      // destello del tema equivocado.
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('dbviewer') || 'null');
          var theme = saved && saved.state && saved.state.theme;
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.dataset.theme = theme;
        } catch (_) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
